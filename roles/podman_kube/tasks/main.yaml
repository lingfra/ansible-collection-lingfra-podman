---
# tasks file for lingfra.podman.podman_kube

- name: "Ensure {{ podman_kube_containers_dir_path }} exists"
  ansible.builtin.file:
    path: "{{ podman_kube_containers_dir_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: "Include tasks kube.yaml"
  ansible.builtin.include_tasks:
    file: kube.yaml
  loop: "{{ podman_kube_list }}"
  loop_control:
    loop_var: kube
    label: "{{ kube.name }}"
