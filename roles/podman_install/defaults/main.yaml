---
# Automatically generated by aar-doc
# Whether the Podman packages should be installed or not.
# Setting this to false won't include any installation tasks.
# As this role could be included as dependency by other roles, this is useful if it is desired to install Podman with an method not supported by this role.
podman_install_enable: true
# Whether or not fuse-overlayfs should be installed.
# `fuse-overlayfs` is an alternative storage driver for rootless Podman containers.
# The native overlayfs provides better performance is most cases, see upstream documentation for more information: <https://github.com/containers/podman/blob/main/docs/tutorials/performance.md#choosing-a-storage-driver>
podman_install_fuse_overlayfs: false
