---
# tasks file for podman_construct

# ---------- Validation ----------

- name: "Assert healthcheck is configured for notify 'healthy' in '{{ service_name_full }}'"
  ansible.builtin.assert:
    that:
      - service.healthcheck.cmd is defined
      - service.healthcheck.cmd | lower != 'none'
    fail_msg: "Service '{{ service_name_full }}' sets 'notify: healthy', which requires 'healthcheck.cmd' to be set."
    quiet: true
  when:
    - service.notify | default('') | string | lower == 'healthy'

- name: "Initialize internal facts for service '{{ service_name_full }}'"
  ansible.builtin.set_fact:
    podman_construct_container_systemd_options: ""
    service_secrets: []
    service_systemd_options: {}
    service_systemd_options_unit: {}
    service_volume_list: []

- name: "Set fact podman_construct_networks"
  ansible.builtin.set_fact:
    podman_construct_networks: "{{ service.network }}"
  when:
    - service.network is defined

# ---------- Systemd / Service Options ----------

- name: "Set fact service_systemd_options for '{{ service_name_full }}'"
  ansible.builtin.set_fact:
    service_systemd_options:
      Service:
        Restart: "{{ service.restart | default('no') }}"
      Install:
        WantedBy: "{{ service.install | default('default.target') }}"

- name: "Set fact service_systemd_options_unit for '{{ service_name_full }}'"
  ansible.builtin.set_fact:
    service_systemd_options_unit:
      Unit:
        Requires: "{{ deps | join(' ') }}"
        After: "{{ deps | join(' ') }}"
  when:
    - service.depends_on | default([]) | length > 0
  vars:
    deps: "{{ service.depends_on | map('ansible.builtin.regex_replace', '^(.*)$', podman_construct.name ~ '-\\1' ~ '.service') }}"

- name: "Set fact podman_construct_container_systemd_options"
  ansible.builtin.set_fact:
    podman_construct_container_systemd_options: "{{ lookup('ansible.builtin.template', 'systemd_options.j2') }}"
  vars:
    systemd_dict: "{{ service_systemd_options | ansible.builtin.combine(service_systemd_options_unit, recursive=True) }}"

# ---------- Secrets ----------

- name: "Set fact service_secrets for '{{ service_name_full }}'"
  ansible.builtin.set_fact:
    service_secrets: "{{ service_secrets + [
        (
          (podman_construct.name, secret.name) | join('-'),
          'type=env',
          'target=' ~ secret.env
        ) | join(',')
      ] }}"
  loop: "{{ service.secrets }}"
  loop_control:
    loop_var: secret
    label: "{{ secret.name }}"
  when:
    - service.secrets is defined

# ---------- User Namespace ----------

- name: "Set fact service_userns with user mapping for '{{ service_name_full }}'"
  ansible.builtin.set_fact:
    service_userns: "auto:uidmapping={{ container_uid }}:{{ host_uid }}:1,gidmapping={{ container_gid }}:{{ host_gid }}:1"
  vars:
    container_gid: "{{ service.map_user.container_gid | default(service.map_user.container_uid) }}"
    container_uid: "{{ service.map_user.container_uid }}"
    host_gid: "{{ getent_group[service.map_user.host_group][1] if service.map_user.host_group is defined else getent_passwd[service.map_user.host_user][2] }}"
    host_uid: "{{ getent_passwd[service.map_user.host_user][1] }}"
  when:
    - service.map_user is defined
    - service.userns is not defined
    - service.map_user.host_user is defined

- name: "Set fact service_userns with user mapping for '{{ service_name_full }}'"
  ansible.builtin.set_fact:
    service_userns: "auto:uidmapping={{ container_uid }}:{{ host_uid }}:1,gidmapping={{ container_gid }}:{{ host_gid }}:1"
  vars:
    container_gid: "{{ service.map_user.container_gid | default(service.map_user.container_uid) }}"
    container_uid: "{{ service.map_user.container_uid }}"
    host_gid: "{{ service.map_user.host_gid }}"
    host_uid: "{{ service.map_user.host_uid }}"
  when:
    - service.map_user is defined
    - service.userns is not defined
    - service.map_user.host_uid is defined

- name: "Set fact service_userns from arguments for '{{ service_name_full }}"
  ansible.builtin.set_fact:
    service_userns: "{{ service.userns }}"
  when:
    - service.userns is defined

# ---------- Volume Options ----------

- name: "Include tasks volume.yaml"
  ansible.builtin.include_tasks:
    file: "{{ volume_type }}_volume.yaml"
    apply:
      tags:
        - podman_construct
  loop: "{{ service.volumes }}"
  loop_control:
    loop_var: volume
  vars:
    volume_type: "{{ 'bind' if (volume.src[0] in ['/', '.']) else 'named' }}"
  when:
    - service.volumes is defined

# ---------- Container Definition ----------

- name: "Create container '{{ service_name_full }}'"
  containers.podman.podman_container:
    image: "{{ service.image }}"
    name: "{{ service_name_full }}"
    state: quadlet

    cap_add: "{{ service.cap_add | default(omit) }}"
    cap_drop: "{{ service.cap_drop | default(omit) }}"
    command: "{{ service.command | default(omit) }}"
    entrypoint: "{{ service.entrypoint | default(omit) }}"
    env: "{{ service.env | default(omit) }}"
    healthcheck: "{{ service.healthcheck.cmd | default(omit) }}"
    healthcheck_failure_action: "{{ service.healthcheck.on_failure | default(omit) }}"
    healthcheck_interval: "{{ service.healthcheck.interval | default(omit) }}"
    healthcheck_retries: "{{ service.healthcheck.retries | default(omit) }}"
    healthcheck_start_period: "{{ service.healthcheck.start_period | default(omit) }}"
    healthcheck_timeout: "{{ service.healthcheck.timeout | default(omit) }}"
    health_log_destination: "{{ service.healthcheck.log_destination | default(omit) }}"
    health_max_log_count: "{{ service.healthcheck.max_log_count | default(omit) }}"
    health_max_log_size: "{{ service.healthcheck.max_log_size | default(omit) }}"
    health_startup_cmd: "{{ service.healthcheck.startup.cmd | default(omit) }}"
    health_startup_interval: "{{ service.healthcheck.startup.interval | default(omit) }}"
    health_startup_retries: "{{ service.healthcheck.startup.retries | default(omit) }}"
    health_startup_success: "{{ service.healthcheck.startup.success | default(omit) }}"
    health_startup_timeout: "{{ service.healthcheck.startup.timeout | default(omit) }}"
    hostname: "{{ omit if podman_construct.pod | default(false) else service.hostname | default(service.name) }}"
    labels: "{{ service.labels if service.labels is defined else omit }}"
    network: "{{ podman_construct_networks if podman_construct_networks is defined else omit }}"
    pod: "{{ podman_construct_pod if podman_construct_pod is defined else omit }}"
    publish: "{{ service.publish | default(omit) }}"
    pull: "{{ service.pull | default('newer') }}"
    # Pass a list instead of a string: Ansible would split a string on commas.
    # Entries without a section header land in the [Container] section.
    quadlet_options: "{{ [service_auto_update, podman_construct_container_systemd_options] | select | list }}"
    sdnotify: "{{ service.notify | string | lower if service.notify is defined else omit }}"
    secrets: "{{ service_secrets if service_secrets is defined else omit }}"
    user: "{{ service.user | default(omit) }}"
    userns: "{{ service_userns if service_userns is defined else omit }}"
    volume: "{{ service_volume_list | default(omit) }}"
  become: true
  notify:
    - "Systemd daemon reload"
    - "Restart changed services"
  register: podman_construct_service_quadlet
  vars:
    service_auto_update: "{{ ('AutoUpdate=' ~ service.auto_update) if service.auto_update is defined else '' }}"

# ---------- Restart ----------

# Not a handler: the unit name is only known in this loop iteration. The
# handler "Restart changed services" restarts the collected units.
- name: "Add service to podman_construct_services_restart for '{{ service_name_full }}'"  # noqa: no-handler
  ansible.builtin.set_fact:
    podman_construct_services_restart: "{{ podman_construct_services_restart + [service_name_full ~ '.service'] }}"
  when:
    - podman_construct_service_quadlet is changed

# ---------- Clean-Up ----------

- name: "Nullify internal variables from '{{ service_name_full }}'"
  ansible.builtin.set_fact:
    service_userns: null
    service_secrets: null
