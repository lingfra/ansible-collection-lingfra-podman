---
# argument specs file for podman_construct

argument_specs:
  main:
    short_description: "Main entry point for podman_construct role"
    description:
      - "This is the main entrypoint for the podman_construct role."
      - "Creates the quadlet files for the containerized components."
      - "Restarts a service after its container quadlet file changed, which also starts it on the first deployment."
      - "Services are also restarted when one of their secrets changed, because Podman passes secrets to the container when it is created."
      - "A pod is restarted after its quadlet file changed, which restarts all containers in the pod."
    author:
      - "Stella Kemmerling"
    options:
      podman_construct_list:
        type: "list"
        elements: "dict"
        required: true
        description:
          - "Specifies the configuration for the containers to be created."
        options:
          name:
            type: "str"
            required: true
            description:
              - "Name of the construct. Will be appended to all the created content from this role."
          networks:
            type: "list"
            elements: "dict"
            required: false
            description:
              - "Definition of networks, which should be available in this construct."
            options:
              name:
                type: "str"
                required: true
                description:
                  - "Name of the network."
              driver:
                type: "str"
                required: false
                choices:
                  - "bridge"
                  - "macvlan"
                  - "ipvlan"
                  - "external"
                description:
                  - "Optionally set the driver for the network."
                  - "Refer to [**podman-network-create(1)**](https://docs.podman.io/en/latest/markdown/podman-network-create.1.html) for more information."
                  - "The special value `external` indicates that the network should be assumed existing and not managed by Ansible."
                  - "If unspecified falls back to `bridge`."
          pod:
            type: "bool"
            required: false
            description:
              - "Whether the services (containers) should be placed in a pod or not."
              - "If not placed in a pod, a network will be created."
          secrets:
            type: "dict"
            required: false
            description:
              - "A dictionary of secrets in the form `name: content`."
              - "It is necessary to define a secret here to use it in the service configuration."
          services:
            type: "list"
            elements: "dict"
            required: true
            description:
              - "Dictionary containing the definition of services."
            options:
              auto_update:
                type: "str"
                required: false
                choices:
                  - "registry"
                  - "local"
                description:
                  - "Enables automatic updates of the container image with `podman auto-update`."
                  - "`registry` pulls the image when the registry digest of the configured tag differs from the local one."
                  - "It requires a fully qualified image name."
                  - "`local` only restarts the container when the image in local storage was updated, e. g. by a manual pull or build."
                  - "The updates run through the `podman-auto-update.timer`, which is managed by the `podman_auto_update` role."
                  - "Combine it with `notify: healthy`, so `podman auto-update` rolls back to the previous image if the new container never becomes healthy."
                  - "Refer to [**podman-auto-update(1)**](https://docs.podman.io/en/latest/markdown/podman-auto-update.1.html) for more information."
              cap_add:
                type: "list"
                elements: "str"
                required: false
              cap_drop:
                type: "list"
                elements: "str"
                required: false
              command:
                type: "list"
                elements: "str"
                required: false
              depends_on:
                type: "str"
                required: false
                description:
                  - "List of other containers or services this container should depend on."
              entrypoint:
                type: "str"
                required: false
              env:
                type: "dict"
                required: false
                description:
                  - "Environment variables for the container."
              healthcheck:
                type: "dict"
                required: false
                description:
                  - "Health check configuration for the container."
                  - "Refer to [**podman-run(1)**](https://docs.podman.io/en/latest/markdown/podman-run.1.html) for more information."
                  - "The options correspond to the `--health-*` options of podman."
                options:
                  cmd:
                    type: "str"
                    required: false
                    description:
                      - "Command to run inside the container to check its health."
                      - "Use `none` to disable a health check defined in the container image."
                  interval:
                    type: "str"
                    required: false
                    description:
                      - "Interval between health checks (e. g. `30s`). The value `disable` results in no automatic timer setup."
                  log_destination:
                    type: "str"
                    required: false
                    description:
                      - "Destination of the health check logs. Either `local`, `events_logger` or a directory path."
                  max_log_count:
                    type: "int"
                    required: false
                    description:
                      - "Maximum number of health check log entries to keep. `0` means infinite."
                  max_log_size:
                    type: "int"
                    required: false
                    description:
                      - "Maximum character length of each health check log entry. `0` means infinite."
                  on_failure:
                    type: "str"
                    required: false
                    choices:
                      - "none"
                      - "kill"
                      - "restart"
                      - "stop"
                    description:
                      - "Action to take when the container is considered unhealthy."
                  retries:
                    type: "int"
                    required: false
                    description:
                      - "Number of consecutive failures before the container is considered unhealthy."
                  start_period:
                    type: "str"
                    required: false
                    description:
                      - "Initialization time of the container, during which failed health checks are not counted (e. g. `1m`)."
                  timeout:
                    type: "str"
                    required: false
                    description:
                      - "Maximum time a health check command may run before it is considered failed (e. g. `30s`)."
                  startup:
                    type: "dict"
                    required: false
                    description:
                      - "Startup health check, which runs until it succeeds before the regular health check begins."
                    options:
                      cmd:
                        type: "str"
                        required: true
                        description:
                          - "Command to run inside the container for the startup health check."
                      interval:
                        type: "str"
                        required: false
                        description:
                          - "Interval between startup health checks."
                      retries:
                        type: "int"
                        required: false
                        description:
                          - "Number of attempts before the container is restarted. `0` means the container is never restarted."
                      success:
                        type: "int"
                        required: false
                        description:
                          - "Number of successful runs required before the regular health check begins."
                      timeout:
                        type: "str"
                        required: false
                        description:
                          - "Maximum time a startup health check command may run before it is considered failed."
              hostname:
                type: "str"
                required: false
                description:
                  - "Hostname of the container."
                  - "Defaults to use the service name from the construct config."
              image:
                type: "str"
                required: false
                description:
                  - "Fully qualified image name (FQIN) and version (tag or digest) of the container image."
              labels:
                type: "dict"
                required: false
                description:
                  - "Labels to be added to the container"
              map_user:
                type: "dict"
                required: false
                description:
                  - "A user to be mapped into the container user namespace."
                  - "Using this option implies user namespace mode `auto`."
                  - "This option is ignored when specifying `userns`."
                mutually_exclusive:
                  - ["host_uid", "host_user"]
                  - ["host_gid", "host_group"]
                options:
                  container_gid:
                    type: "int"
                    required: false
                    description:
                      - "The GID to be mapped into the container. Defaults to `container_uid` if unspecified."
                  container_uid:
                    type: "int"
                    required: true
                    description:
                      - "The UID to be mapped into the container."
                  host_uid:
                    type: "int"
                    required: false
                  host_user:
                    type: "str"
                    required: false
                    description:
                      - "A user on the host system."
                  host_gid:
                    type: "int"
                    required: false
                  host_group:
                    type: "str"
                    required: false
                    description:
                      - "A group on the host system. If empty the primary group of `host_user` will be used."
              name:
                type: "str"
                required: true
                description:
                  - "Name of the service."
              network:
                type: "list"
                elements: "str"
                required: false
                description:
                  - "Networks the container should be attached to."
              notify:
                type: "str"
                required: false
                choices:
                  - "true"
                  - "false"
                  - "healthy"
                description:
                  - "How systemd startup notifications are handled for the container."
                  - "`true` lets the application inside the container send the notification itself (requires sd_notify support)."
                  - "`healthy` delays the notification until the container is marked healthy (requires `healthcheck.cmd`)."
                  - "Defaults to `false`, where the service is started once the container runtime starts the container."
                  - "Refer to [**podman-systemd.unit(5)**](https://docs.podman.io/en/latest/markdown/podman-systemd.unit.5.html) for more information."
              pod:
                type: "str"
                required: false
                description:
                  - "Pod the container should be attached to."
              pull:
                type: "str"
                required: false
                description:
                  - "Pull policy for the container."
              publish:
                type: "list"
                elements: "str"
                required: false
                description:
                  - "List of port mappings for the container."
              restart:
                type: "str"
                required: false
                choices:
                  - "always"
                  - "no"
                  - "on-abnormal"
                  - "on-abort"
                  - "on-failure"
                  - "on-success"
                  - "on-watchdog"
                description:
                  - "Policy for restarting the service on exit. Takes the systemd service options, see **[systemd.service(5)](https://www.freedesktop.org/software/systemd/man/latest/systemd.service.html#Restart=)**."
              secrets:
                type: "list"
                elements: "dict"
                required: false
                description:
                  - "Secrets the container should get access to."
                options:
                  name:
                    type: "str"
                    required: true
                    description:
                      - "The name of the secret as defined in the `secrets` top level option."
                  env:
                    type: "str"
                    required: true
                    description:
                      - "Name of the environment variable inside the container, which should contain the secret."
              user:
                type: "str"
                required: false
                description:
                  - "User running the application inside the container. Either name or UID."
              userns:
                type: "str"
                required: false
                description:
                  - "User namespace mode for the container."
                  - "Overwrites `map_user` when configured."
              volumes:
                type: "list"
                elements: "dict"
                required: false
                description:
                  - "Volumes for the container."
                options:
                  src:
                    type: "str"
                    required: true
                    description:
                      - "Named volume or source directory on the host."
                  dest:
                    type: "str"
                    required: true
                    description:
                      - "Destination directory inside the container."
                  options:
                    type: "str"
                    required: false
                    description:
                      - "Mount options for the volume (e. g. `ro`)."
                  owner:
                    type: "str"
                    required: false
                    description:
                      - "If this is a bind volume and the folder is non-existing, the newly created folder will be owned by this user. Does not modify existing folders."
                  group:
                    type: "str"
                    required: false
                    description:
                      - "Same as owner, but for group."
                  mode:
                    type: "str"
                    required: false
                    description:
                      - "If this is a bind volume and the folder is non-existing, the newly created folder will have this mode. Does not modify existing folders."

      podman_construct_network_list:
        type: "list"
        elements: "dict"
        required: false
        description:
          - "A list of servive unrelated networks to create."
          - "Most options are passthroughed to the ansible module [containers.podman.podman_network](https://docs.ansible.com/projects/ansible/latest/collections/containers/podman/podman_network_module.html)."
          - "See its documentation for a reference to the options."
        options:
          disable_dns:
            type: "bool"
            required: false
          dns:
            type: "str"
            required: false
          driver:
            type: "str"
            required: false
            choices:
              - "bridge"
              - "macvlan"
              - "ipvlan"
              - "external"
            description:
              - "Optionally set the driver for the network."
              - "Refer to [**podman-network-create(1)**](https://docs.podman.io/en/latest/markdown/podman-network-create.1.html) for more information."
              - "The special value `external` indicates that the network should be assumed existing and not managed by Ansible."
              - "If unspecified falls back to `bridge`."
          gateway:
            type: "str"
            required: false
          interface_name:
            type: "str"
            required: false
          internal:
            type: "bool"
            required: false
          ipam_driver:
            type: "str"
            required: false
          ipv6:
            type: "str"
            required: false
          name:
            type: "str"
            required: true
            description:
              - "Name of the quadlet file."
          network_name:
            type: "str"
            required: false
            description:
              - "Name of the podman network (e. g. `podman network ls`)."
          state:
            type: "str"
            required: false
            choices:
              - "present"
              - "absent"
            description:
              - "This is the only option, which has little different effects than the original option from the ansible module."
              - "As this role always creates a quadlet `present` means that the quadlet is present and `absent` means that the quadlet is removed."
          subnet:
            type: "str"
            required: false
