# Automatically generated by aar-doc
# Whether the system `podman-auto-update.timer` is enabled and started.
# When `false`, the timer is disabled and stopped.
# Hosts without the timer unit (e. g. without Podman) are skipped, so the role can be applied to the whole inventory.
podman_auto_update_enabled: false
# A list of users for which the user `podman-auto-update.timer` is managed.
# Lingering must be enabled for every user in this list, because the timer only runs while the user's systemd instance is running.
# The role fails if lingering is not enabled, but does not manage it.
# Removing a user from this list does not change anything for that user. Set `enabled: false` instead.
podman_auto_update_user_list: []
